name: Translate Shortcut signature

# Resources/Translate.shortcut carries a signature from Apple that runs out
# about 13 months after it was made. This fails once fewer than 30 days are
# left, as a reminder to re-run scripts/make-translate-shortcut.py — apart from
# the build workflow, so that the date never blocks a build or a release.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check the signature's end date
        run: python3 scripts/make-translate-shortcut.py --check --strict
