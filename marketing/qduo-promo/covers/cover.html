<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>QDuo covers</title>
<!-- Alternative covers. ?style=dark|gradient|editorial|bento|desktop &size=43|34
     Every product picture is a cut of a real QDuo recording (shots.js); only the 3D Glass ring is shown. -->
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}html,body{margin:0;overflow:hidden}
#c{position:relative;overflow:hidden}
.s43{width:1440px;height:1080px}.s34{width:1080px;height:1440px}
.brand{display:flex;align-items:center;gap:14px;font-weight:650;font-size:28px;letter-spacing:-.8px}.brand img{width:46px;height:46px}
.shot img{display:block}

/* ---------- A · dark: a single lit product on black ---------- */
.dark{background:#05070d;color:#fff}
.dark:before{content:"";position:absolute;inset:0;background:radial-gradient(600px 520px at var(--gx) var(--gy),#1d5cff55,transparent 70%),radial-gradient(500px 400px at calc(var(--gx) + 120px) calc(var(--gy) + 160px),#00d2ff22,transparent 70%)}
.dark .brand{position:absolute;left:84px;top:72px}
.dark .copy{position:absolute}
.dark h1{font-size:84px;line-height:1.16;letter-spacing:-3px;font-weight:650;margin:0}
.dark h1 em{font-style:normal;background:linear-gradient(100deg,#6fb3ff,#46e2ff);-webkit-background-clip:text;color:transparent}
.dark p{font-size:24px;line-height:1.6;color:#9aa8bd;margin:28px 0 0;letter-spacing:.5px}
.dark .chips{display:flex;gap:12px;flex-wrap:wrap;margin-top:40px}
.dark .chips span{font-size:18px;padding:10px 18px;border-radius:30px;border:1px solid #ffffff26;color:#d5deeb;background:#ffffff0a}
.dark .chips span.more{border-color:#4aa3ff88;color:#8cc8ff}
.dark .hero{position:absolute;border-radius:34px;overflow:hidden;box-shadow:0 0 0 1px #ffffff1f,0 40px 120px -20px #1e6bff99,0 0 220px -40px #22c7ff66}
.dark.s43{--gx:1040px;--gy:560px}.dark.s43 .copy{left:84px;top:270px;width:640px}.dark.s43 h1{font-size:72px}.dark.s43 .hero{left:735px;top:200px;width:620px}
.dark.s34{--gx:540px;--gy:960px}.dark.s34 .copy{left:84px;top:200px;width:900px}.dark.s34 .hero{left:220px;top:700px;width:640px}
.dark .foot{position:absolute;left:84px;right:84px;bottom:64px;display:flex;justify-content:space-between;color:#5d6b80;font-size:16px;letter-spacing:3px}

/* ---------- B · gradient: a loud poster ---------- */
.gradient{background:linear-gradient(140deg,#1f5bff 0%,#1592ff 38%,#0bc2d4 70%,#38e0b4 100%);color:#fff}
.gradient:after{content:"";position:absolute;inset:0;background:radial-gradient(800px 600px at 85% 10%,#ffffff2e,transparent 60%),radial-gradient(700px 500px at 0% 100%,#7a4dff55,transparent 70%)}
.gradient .big{position:absolute;z-index:1;display:flex;align-items:center;font-weight:800;line-height:1;color:#fff}
.gradient .big span{letter-spacing:-.06em}
.gradient .big img{filter:drop-shadow(0 18px 30px #0a2a7a88);margin-right:.12em}
.gradient .tag{position:absolute;z-index:1;font-size:34px;font-weight:600;letter-spacing:1px}
.gradient .tag small{display:block;font-size:20px;font-weight:450;opacity:.85;margin-top:14px;letter-spacing:2px}
.gradient .card{position:absolute;z-index:2;border-radius:28px;overflow:hidden;box-shadow:0 50px 90px -30px #0a2a7acc,0 0 0 1px #ffffff55}
.gradient.s43 .big{left:76px;top:110px;font-size:190px}.gradient.s43 .big img{width:170px;height:170px}
.gradient.s43 .tag{left:84px;top:350px;width:640px}
.gradient.s43 .c1{left:790px;top:170px;width:560px;transform:rotate(-4deg)}
.gradient.s43 .c2{left:84px;top:560px;width:600px;transform:rotate(2.5deg)}
.gradient.s43 .c3{left:150px;top:840px;width:560px;transform:rotate(-2.5deg)}
.gradient.s34 .big{left:64px;top:90px;font-size:200px}.gradient.s34 .big img{width:180px;height:180px}
.gradient.s34 .tag{left:72px;top:330px;width:900px}
.gradient.s34 .c1{left:250px;top:440px;width:560px;transform:rotate(-4deg)}
.gradient.s34 .c2{left:50px;top:1075px;width:540px;transform:rotate(2.5deg)}
.gradient.s34 .c3{left:500px;top:1275px;width:530px;transform:rotate(-2.5deg)}

/* ---------- C · editorial: a magazine page ---------- */
.editorial{background:#f3eee4;color:#1d1a16;font-family:"Songti SC","STSong",serif}
.editorial .mast{position:absolute;left:80px;right:80px;top:64px;display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #1d1a16;padding-bottom:16px;font-family:-apple-system,"PingFang SC",sans-serif;font-size:15px;letter-spacing:4px;font-weight:600}
.editorial .mast b{font-size:30px;letter-spacing:-.5px;font-weight:700}
.editorial h1{position:absolute;font-weight:900;margin:0;line-height:1.08;letter-spacing:-2px}
.editorial .lede{position:absolute;font-size:23px;line-height:1.75;color:#4b4339;margin:0}
.editorial ol{position:absolute;list-style:none;margin:0;padding:0;font-family:-apple-system,"PingFang SC",sans-serif}
.editorial li{display:grid;grid-template-columns:56px 1fr;border-top:1px solid #1d1a1655;padding:14px 0;font-size:19px;color:#3c352d}
.editorial li b{font-family:"Songti SC",serif;font-size:26px;font-weight:900;color:#1d1a16}
.editorial li span b{font-family:-apple-system,"PingFang SC",sans-serif;font-size:20px;font-weight:650;margin-right:12px}
.editorial figure{position:absolute;margin:0}
.editorial figure .shot{border:1.5px solid #1d1a16;box-shadow:12px 12px 0 #1d1a16}
.editorial figcaption{font-family:-apple-system,"PingFang SC",sans-serif;font-size:15px;color:#6a6055;margin-top:26px;letter-spacing:1px}
.editorial .page{position:absolute;bottom:52px;left:80px;right:80px;display:flex;justify-content:space-between;font-family:-apple-system,"PingFang SC",sans-serif;font-size:14px;letter-spacing:3px;color:#7a6f62}
.editorial.s43 h1{left:80px;top:150px;font-size:96px;width:640px}.editorial.s43 .lede{left:84px;top:400px;width:560px}
.editorial.s43 ol{left:84px;top:560px;width:560px}.editorial.s43 figure{left:740px;top:170px;width:600px}
.editorial.s34 h1{left:80px;top:150px;font-size:100px;width:920px}.editorial.s34 .lede{left:84px;top:400px;width:900px}
.editorial.s34 figure{left:200px;top:520px;width:560px}.editorial.s34 ol{left:84px;top:1170px;width:910px;display:grid;grid-template-columns:1fr 1fr;column-gap:40px}

/* ---------- D · bento: a grid of real moments ---------- */
.bento{background:#eceff4;color:#16233c}
.bento .grid{position:absolute;display:grid;gap:22px}
.bento .tile{background:#fff;border-radius:30px;padding:28px;position:relative;overflow:hidden;box-shadow:0 1px 0 #ffffff,0 18px 40px -28px #3b5a8f55}
.bento .tile h3{margin:0 0 6px;font-size:24px;font-weight:650;letter-spacing:-.4px}
.bento .tile p{margin:0;font-size:16px;color:#6b7e95;line-height:1.5}
.bento .tile .shot{border-radius:14px;margin-top:20px;box-shadow:0 0 0 1px #dfe6ef}
.bento .hero{background:linear-gradient(160deg,#ffffff,#eaf3ff)}
.bento .hero .shot{margin:26px auto 0;box-shadow:none;border-radius:20px;width:min(100%,500px)}.bento.s43 .hero{display:flex;flex-direction:column}.bento.s43 .hero .shot{margin:auto}
.bento .brandtile{background:linear-gradient(150deg,#1f6bff,#14b8d8);color:#fff}
.bento .brandtile .brand{font-size:40px}.bento .brandtile .brand img{width:64px;height:64px}
.bento .brandtile h2{font-size:34px;margin:22px 0 0;font-weight:600;letter-spacing:.5px}
.bento .brandtile p{color:#dceaff;margin-top:10px}
.bento .custom ul{list-style:none;padding:0;margin:16px 0 0;display:flex;flex-wrap:wrap;gap:10px}
.bento .custom li{font-size:15px;padding:8px 13px;border-radius:20px;background:#eef4fc;color:#2e6ab8}
.bento.s43 .grid{left:56px;top:56px;right:56px;bottom:56px;grid-template-columns:1.6fr 1fr 1fr;grid-template-rows:1fr 1fr 1fr}
.bento.s43 .hero{grid-row:1/4}.bento.s43 .brandtile{grid-column:2/4}
.bento.s34 .grid{left:48px;top:48px;right:48px;bottom:48px;grid-template-columns:1fr 1fr;grid-template-rows:auto 2.3fr 1fr 1fr}.bento.s34 .hero .shot{width:min(100%,430px)}
.bento.s34 .brandtile{grid-column:1/3}.bento.s34 .hero{grid-column:1/3}

/* ---------- E · desktop: the app in its natural habitat ---------- */
.desktop{color:#fff;background:#4b2b8f}
.desktop:before{content:"";position:absolute;inset:-10%;background:radial-gradient(60% 55% at 15% 20%,#ff9f6b,transparent 60%),radial-gradient(55% 60% at 85% 15%,#ff5f9e,transparent 60%),radial-gradient(70% 70% at 70% 90%,#5b3fd6,transparent 65%),radial-gradient(50% 50% at 20% 85%,#2c8cff,transparent 65%);filter:blur(10px)}
.desktop .menubar{position:absolute;left:0;right:0;top:0;height:34px;background:#ffffff2e;backdrop-filter:blur(20px);display:flex;align-items:center;gap:26px;padding:0 22px;font-size:15px;font-weight:500}
.desktop .menubar img{width:18px;height:18px}
.desktop .menubar .r{margin-left:auto;opacity:.9}
.desktop .title{position:absolute;text-shadow:0 4px 30px #2a0f5a66}
.desktop .title h1{margin:0;font-size:76px;line-height:1.15;font-weight:700;letter-spacing:-2px}
.desktop .title p{margin:18px 0 0;font-size:24px;opacity:.9;letter-spacing:1px}
.desktop .win{position:absolute;border-radius:22px;overflow:hidden;box-shadow:0 60px 120px -30px #1a0640cc,0 0 0 1px #ffffff40;transform-origin:50% 50%}
.desktop.s43 .title{left:90px;top:120px;width:1260px}.desktop.s43 .win{left:250px;top:400px;width:940px;transform:perspective(2200px) rotateX(9deg)}
.desktop.s34 .title{left:80px;top:130px;width:920px}.desktop.s34 .title h1{font-size:64px}.desktop.s34 .win{left:60px;top:560px;width:960px;transform:perspective(2200px) rotateX(7deg)}
</style>
</head>
<body>
<div id="c"></div>
<script src="shots.js"></script>
<script>
const q=new URLSearchParams(location.search),style=q.get('style')||'dark',size=q.get('size')||'43';
const c=document.getElementById('c');c.className=`${style} s${size}`;
const icon='<img src="../assets/icon.png" alt="">';
const T={
dark:`<div class="brand">${icon}QDuo</div>
 <div class="copy"><h1>选中文字，<br><em>下一步就在手边。</em></h1>
 <p>翻译、写作、润色、朗读，一个圆环全部触手可及。<br>为 macOS 而生。</p>
 <div class="chips"><span>翻译</span><span>写作</span><span>润色</span><span>朗读</span><span class="more">＋ 自定义动作</span></div></div>
 <div class="hero shot" data-shot="donutSub"></div>
 <div class="foot"><span>3D GLASS</span><span>SELECT. ACT.</span></div>`,
gradient:`<div class="big">${icon}<span>QDuo</span></div>
 <div class="tag">选中文字，下一步就在手边。<small>翻译 · 写作 · 润色 · 朗读 · 还有更多，由你定义</small></div>
 <div class="card c1 shot" data-shot="donutSub"></div>
 <div class="card c2 shot" data-shot="compare"></div>
 <div class="card c3 shot" data-shot="translate"></div>`,
editorial:`<div class="mast"><b>QDuo</b><span>为 MACOS 而生 · 第 01 期</span></div>
 <h1>一次选中，<br>万般可能。</h1>
 <p class="lede">在任何 App 里选中一段文字，一个立体的玻璃圆环就出现在指尖。下一步要做什么，它已经替你准备好了。</p>
 <ol><li><b>01</b><span><b>翻译</b>中英互译，就在原地</span></li><li><b>02</b><span><b>写作</b>几个要点，扩成完整表达</span></li>
 <li><b>03</b><span><b>润色</b>看清每一处修改，一键替换</span></li><li><b>04</b><span><b>朗读</b>逐词高亮，读给你听</span></li></ol>
 <figure><div class="shot" data-shot="donutSub"></div><figcaption>图 · 3D Glass 圆环：悬停「更多」，二级菜单随即展开。</figcaption></figure>
 <div class="page"><span>QDUO</span><span>SELECT. ACT.</span></div>`,
bento:`<div class="grid">
 <div class="tile brandtile"><div class="brand">${icon}QDuo</div><h2>选中文字，下一步就在手边。</h2><p>为 macOS 而生的选词工具条</p></div>
 <div class="tile hero"><h3>3D Glass 圆环</h3><p>跟随光标倾斜，「更多」展开二级菜单</p><div class="shot" data-shot="donutSub"></div></div>
 <div class="tile"><h3>翻译</h3><p>结果就在选区旁边</p><div class="shot" data-shot="translate"></div></div>
 <div class="tile"><h3>润色</h3><p>删改一目了然，一键替换</p><div class="shot" data-shot="compare"></div></div>
 <div class="tile"><h3>朗读</h3><p>逐词高亮，云端语音</p><div class="shot" data-shot="read"></div></div>
 <div class="tile custom"><h3>由你定义</h3><p>动作、提示词、分组都能改</p><ul><li>自定义 AI 提示词</li><li>快捷指令</li><li>Shell 脚本</li><li>网页搜索</li><li>分组二级菜单</li></ul></div>
 </div>`,
desktop:`<div class="menubar">${icon}<b>QDuo</b><span>文件</span><span>编辑</span><span>显示</span><span class="r">周五 10:08</span></div>
 <div class="title"><h1>选中文字，下一步就在手边。</h1><p>QDuo · 翻译、写作、润色、朗读，以及你定义的一切</p></div>
 <div class="win shot" data-shot="docHero"></div>`
};
c.innerHTML=T[style];
// Bento tiles size their shots to the tile width; give layout a frame to settle first.
requestAnimationFrame(()=>Promise.all([document.fonts.ready,placeShots()]).then(()=>window.ready=true).catch(e=>{window.failed=String(e)}));
</script>
</body>
</html>
